<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="100" viewBox="0 0 120 100" role="img" aria-label="Litecoin, Pepecoin and Dogecoin">
  <defs>
    <style>
      .lbl { font-family: Ubuntu, "Segoe UI", system-ui, sans-serif; font-weight: 700; fill: #fff; }
    </style>
  </defs>
  <!-- Litecoin -->
  <g transform="translate(60 30)">
    <circle r="27" fill="#345D9D"/>
    <text class="lbl" x="0" y="9" text-anchor="middle" font-size="30">Ł</text>
  </g>
  <!-- Pepecoin P -->
  <g transform="translate(36 70)">
    <circle r="27" fill="#269B4D"/>
    <text class="lbl" x="0" y="10" text-anchor="middle" font-size="28">P</text>
    <rect x="-14" y="-2" width="18" height="3.5" fill="#fff" rx="0.5"/>
  </g>
  <!-- Dogecoin -->
  <g transform="translate(84 70)">
    <circle r="27" fill="#C2A633"/>
    <text class="lbl" x="0" y="10" text-anchor="middle" font-size="28">Ð</text>
  </g>
</svg>
