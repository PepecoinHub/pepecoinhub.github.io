<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" aria-hidden="true">
<!-- FREN AVATAR v2 shared geometry: eye line y=215; LEFT eye center x=205, RIGHT x=307; eye half-w~44 half-h~40. Outline #16210f. -->
<!-- left eye white -->
<ellipse cx="205" cy="215" rx="44" ry="40" fill="#f7faec" stroke="#16210f" stroke-width="7"/>
<!-- right eye white -->
<ellipse cx="307" cy="215" rx="44" ry="40" fill="#f7faec" stroke="#16210f" stroke-width="7"/>
<!-- pupils look slightly outward/up (classic Pepe) -->
<circle cx="214" cy="210" r="15" fill="#13200f"/>
<circle cx="316" cy="210" r="15" fill="#13200f"/>
<!-- white highlights -->
<circle cx="208" cy="204" r="4.5" fill="#ffffff"/>
<circle cx="310" cy="204" r="4.5" fill="#ffffff"/>
<!-- upper eyelid folds -->
<path d="M163 196 Q205 172 248 194" fill="none" stroke="#16210f" stroke-width="6" stroke-linecap="round"/>
<path d="M264 194 Q307 172 350 196" fill="none" stroke="#16210f" stroke-width="6" stroke-linecap="round"/>
</svg>
