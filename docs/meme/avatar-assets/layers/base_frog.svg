<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" aria-hidden="true">
<!-- FREN AVATAR v2 shared geometry (512x512). Reuse these numbers EXACTLY in every layer:
     head center x=256; crown/top-of-head y~72; face widest ~x=120..392 near y=210.
     eye line center y=215; LEFT eye center (256,215)-> x=205 ; RIGHT eye center x=307 ; eye half-width ~44, half-height ~40.
     mouth center y=300, mouth span x=176..336 ; chin y~362.
     neck y=360..404, neck span x=214..298 ; shoulder line y=404 ; shoulders span x=96..416.
     Paint order: bg -> base -> clothing -> mouth -> eyes -> hat -> accessory.
     SKIN RECOLOR 2026-11-05: muted olive, gloss sheen removed.
     Palette: MUTED OLIVE skin #7a8b45 (shadow #637138), outline #16210f, mouth brown #6b3d22 inner pink #d98c86.
     FLAT fills, NO gradients, NO glossy crown sheen (hand-drawn MS-Paint look). -->
<!-- neck -->
<path d="M214 338 Q210 378 212 404 L300 404 Q302 378 298 338 Z" fill="#637138" stroke="#16210f" stroke-width="7" stroke-linejoin="round"/>
<!-- shoulders / torso base (plain olive, clothing sits on top) -->
<path d="M256 392 Q150 400 110 452 Q92 476 90 512 L422 512 Q420 476 402 452 Q362 400 256 392 Z" fill="#71804a" stroke="#16210f" stroke-width="7" stroke-linejoin="round"/>
<!-- head: classic rounded Pepe head, slightly wider than tall, soft jaw. FLAT muted olive, no top-of-head sheen. -->
<path d="M256 60
  Q150 60 112 150
  Q96 188 100 236
  Q104 300 150 340
  Q196 376 256 376
  Q316 376 362 340
  Q408 300 412 236
  Q416 188 400 150
  Q362 60 256 60 Z"
  fill="#7a8b45" stroke="#16210f" stroke-width="8" stroke-linejoin="round"/>
<!-- cheek / jaw shadow (flat, subtle) -->
<path d="M150 336 Q196 372 256 372 Q316 372 362 336 Q330 360 256 360 Q182 360 150 336 Z" fill="#637138"/>
<!-- brow skin folds above eyes (characteristic Pepe) -->
<path d="M150 182 Q196 150 240 172" fill="none" stroke="#16210f" stroke-width="6" stroke-linecap="round"/>
<path d="M362 182 Q316 150 272 172" fill="none" stroke="#16210f" stroke-width="6" stroke-linecap="round"/>
<!-- faint nostrils / nose fold between eyes and mouth -->
<path d="M246 258 Q256 272 266 258" fill="none" stroke="#6a8339" stroke-width="5" stroke-linecap="round"/>
</svg>
