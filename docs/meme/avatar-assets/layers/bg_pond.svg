<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" aria-hidden="true">
<!-- FREN AVATAR v2 shared geometry: full-canvas background, painted FIRST. Flat hand-drawn pond + sky, no gradients. -->
<rect x="0" y="0" width="512" height="512" fill="#bfe0ef"/>
<!-- distant hills -->
<path d="M0 300 Q128 250 256 292 Q384 332 512 288 L512 340 L0 340 Z" fill="#9ccf86"/>
<!-- pond water lower half -->
<rect x="0" y="332" width="512" height="180" fill="#5aa6c9"/>
<!-- water ripples -->
<path d="M40 390 Q80 380 120 390" fill="none" stroke="#7cc0dd" stroke-width="6" stroke-linecap="round"/>
<path d="M360 420 Q400 410 440 420" fill="none" stroke="#7cc0dd" stroke-width="6" stroke-linecap="round"/>
<!-- lily pad -->
<path d="M96 460 a34 18 0 1 0 68 0 a34 18 0 1 0 -68 0 Z" fill="#4f9a4a"/>
<path d="M130 452 L130 468" stroke="#bfe0ef" stroke-width="6"/>
<!-- sun -->
<circle cx="430" cy="80" r="34" fill="#f6e27a"/>
</svg>
