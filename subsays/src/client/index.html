<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sub Says</title>
<link rel="stylesheet" href="./style.css">
</head>
<body class="theme-classic">
<main id="app">
  <header class="top">
    <div>
      <h1 id="title">Sub Says</h1>
      <p id="sub" class="subline"></p>
    </div>
    <div class="chips">
      <span id="streak" class="chip" hidden></span>
      <button id="help" class="chip btn" aria-label="How to play">?</button>
    </div>
  </header>

  <section id="intro" class="intro" hidden>
    <div class="cards" id="introcards"></div>
    <button id="introgo" class="primary">Let's play</button>
  </section>

  <section id="guess" class="block" hidden></section>
  <section id="collect" class="block" hidden></section>
  <section id="nothing" class="block" hidden></section>

  <nav class="tabs" role="tablist" aria-label="More">
    <button class="tab on" data-tab="standings" role="tab">This week</button>
    <button class="tab" data-tab="board" role="tab">Last board</button>
    <button class="tab" data-tab="how" role="tab">How to play</button>
  </nav>
  <section id="tab-standings" class="panel"></section>
  <section id="tab-board" class="panel" hidden></section>
  <section id="tab-how" class="panel" hidden></section>
  <p id="msg" class="msg" role="status"></p>
  <p id="note" class="note"></p>
  <datalist id="sugg"></datalist>
</main>
<script type="module" src="./main.ts"></script>
</body>
</html>
