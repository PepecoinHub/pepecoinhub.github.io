name: Daily snapshot

on:
  schedule:
    - cron: "17 3 * * *"          # every day at 03:17 UTC: the rich list snapshot
    - cron: "41 * * * *"          # every hour: republish with fresh prices (no snapshot)
  workflow_dispatch:               # the "Run workflow" button
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/snapshot.yml"

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  # Job 1: collect the data. Does not need GitHub Pages, so history starts
  # piling up even before Pages is switched on.
  snapshot:
    if: github.ref == 'refs/heads/main'   # a manual run from another branch must not commit to it or publish it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write              # commit the new snapshot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # full history, so the sitemap can date each page by its last change
          filter: blob:none          # but only the file contents of the current commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Scheduled and manual runs always take a snapshot. A push takes one only
      # if there is none for today yet, so editing the site never overwrites it.
      - name: Take snapshot
        run: |
          today="$(date -u +%F)"
          if [ "${{ github.event.schedule }}" = "41 * * * *" ]; then
            echo "Hourly price run, no snapshot."
          elif [ "${{ github.event_name }}" = "push" ] && [ -f "docs/data/snapshots/${today}.json" ]; then
            echo "Today's snapshot already exists, not taking another one on a push."
          else
            python scripts/snapshot.py || { echo "First attempt failed, retrying in 5 minutes"; sleep 300; python scripts/snapshot.py; }
          fi

      # network hashrate for the mining calculator; never fails the run
      - name: Mining stats
        run: python scripts/mining_stats.py || echo "mining stats not updated"

      - name: Build summary
        run: |
          if ls docs/data/snapshots/*.json >/dev/null 2>&1; then
            python scripts/build_summary.py
          else
            echo "No snapshots yet, publishing the empty state."
          fi

      # the plain-HTML numbers on the home, network and rich list pages, in every language
      - name: Bake numbers into the pages
        run: node scripts/prebake.mjs || echo "page numbers not updated"

      - name: Date the sitemap
        run: python scripts/build_sitemap.py || echo "sitemap dates not updated"

      # summary.json and network.json get a new "generated_at" on every build; if nothing else
      # changed, keep the committed files so a push to main doesn't create an empty data commit
      - name: Skip timestamp-only changes
        run: python scripts/keep_timestamps.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/sitemap.xml $(ls docs/index.html docs/network.html docs/rich-list.html docs/*/index.html docs/*/network.html docs/*/rich-list.html 2>/dev/null)
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "data: snapshot $(date -u +%F)"
            # a merge can land at the same moment: rebase and try again a few times
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              echo "push attempt $i failed, retrying"; sleep $((i * 10))
            done
            exit 1
          fi

  # Job 2: publish the site. Fails with "HttpError: Not Found" in configure-pages
  # until Settings -> Pages -> Source is set to "GitHub Actions".
  deploy:
    needs: snapshot
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}   # still publish (old data) if the snapshot failed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # tip of the branch, includes the snapshot commit from job 1

      - uses: actions/configure-pages@v5

      # PEP and PEPE prices for the price page, published with the site but not committed
      - name: Fetch prices
        timeout-minutes: 8
        continue-on-error: true
        run: python3 scripts/fetch_prices.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
