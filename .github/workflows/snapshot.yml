name: Daily snapshot

on:
  schedule:
    - cron: "17 3 * * *"          # every day at 03:17 UTC: the rich list snapshot
    - cron: "41 * * * *"          # every hour: republish with fresh prices (no snapshot)
  workflow_dispatch:               # the "Run workflow" button
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/snapshot.yml"

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/checks.yml

  # Job 1: collect the data. Does not need GitHub Pages, so history starts
  # piling up even before Pages is switched on.
  snapshot:
    needs: validate
    if: github.ref == 'refs/heads/main'   # a manual run from another branch must not commit to it or publish it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write              # commit the new snapshot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # full history, so the sitemap can date each page by its last change
          filter: blob:none          # but only the file contents of the current commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Manual runs always take a snapshot. Scheduled runs and pushes take one only
      # if there is none for today yet (hourly runs: from 03:00 UTC), so a day keeps
      # one snapshot and editing the site never overwrites it. GitHub often starts
      # the daily cron hours late (around 11:00 UTC lately) or drops it, so the first
      # hourly run after 03:00 UTC that actually fires takes the snapshot instead.
      - name: Take snapshot
        run: |
          today="$(date -u +%F)"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "docs/data/snapshots/${today}.json" ]; then
            echo "Scheduled run, today's snapshot already exists."
          elif [ "${{ github.event.schedule }}" = "41 * * * *" ] && [ "$(date -u +%H)" -lt 3 ]; then
            echo "Hourly price run before 03:00 UTC, the daily snapshot comes later."
          elif [ "${{ github.event_name }}" = "push" ] && [ -f "docs/data/snapshots/${today}.json" ]; then
            echo "Today's snapshot already exists, not taking another one on a push."
          else
            python scripts/snapshot.py || { echo "First attempt failed, retrying in 5 minutes"; sleep 300; python scripts/snapshot.py; }
          fi

      # network hashrate for the mining calculator; never fails the run
      - name: Mining stats
        run: python scripts/mining_stats.py || echo "mining stats not updated"

      # latest videos of youtube.com/@pepecoin for Pond TV (meme edition), once a day; never fails the run
      - name: YouTube channel
        if: github.event.schedule != '41 * * * *'   # once a day is plenty (not on the hourly price runs)
        run: python scripts/fetch_youtube.py || echo "youtube list not updated"

      - name: Build summary
        run: |
          if ls docs/data/snapshots/*.json >/dev/null 2>&1; then
            python scripts/build_summary.py
          else
            echo "No snapshots yet, publishing the empty state."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Shared market quotes
        run: python scripts/fetch_quotes.py

      # The same saved quotes feed both editions and every generated HTML fallback.
      - name: Bake numbers into the pages
        run: node scripts/prebake.mjs

      - name: Date the sitemap
        run: python scripts/build_sitemap.py || echo "sitemap dates not updated"

      # summary.json and network.json get a new "generated_at" on every build; if nothing else
      # changed, keep the committed files so a push to main doesn't create an empty data commit
      - name: Skip timestamp-only changes
        run: python scripts/keep_timestamps.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/sitemap.xml ':(glob)docs/**/*.html'
          git diff --exit-code -- docs
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            if [ -f "docs/data/snapshots/$(date -u +%F).json" ] && ! git diff --cached --quiet -- docs/data/snapshots; then
              git commit -m "data: snapshot $(date -u +%F)"
            else
              git commit -m "data: prices $(date -u '+%F %H:%M') UTC"
            fi
            # a merge can land at the same moment: rebase and try again a few times
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              echo "push attempt $i failed, retrying"; sleep $((i * 10))
            done
            exit 1
          fi

  # Job 2: publish the site. Fails with "HttpError: Not Found" in configure-pages
  # until Settings -> Pages -> Source is set to "GitHub Actions".
  deploy:
    needs: [snapshot, validate]
    if: ${{ !cancelled() && needs.validate.result == 'success' && github.ref == 'refs/heads/main' }}   # still publish (old data) if the snapshot failed
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # tip of the branch, includes the snapshot commit from job 1

      - uses: actions/configure-pages@v5

      # PEP and PEPE prices for the price page, published with the site but not committed
      - name: Fetch prices
        timeout-minutes: 8
        continue-on-error: true
        run: python3 scripts/fetch_prices.py

      # BTC, LTC, DOGE and PEP plus the market backdrop for the market page, published but not committed
      - name: Fetch market
        timeout-minutes: 6
        continue-on-error: true
        run: python3 scripts/fetch_market.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # Pages sometimes hangs in "syncing_files" and the action gives up after 10 minutes
      # (2026-11-07 03:25). Wait longer, and try once more before failing the run.
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 900000

      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000

      - id: deployment
        run: echo "page_url=${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}" >> "$GITHUB_OUTPUT"

      # tell Bing (IndexNow) about the pages changed today; the "Run workflow" button sends all
      # of them. Not on the hourly price runs, so the same pages aren't sent 24 times a day.
      - name: IndexNow
        if: ${{ github.event.schedule != '41 * * * *' }}
        continue-on-error: true
        run: python3 scripts/indexnow.py ${{ github.event_name == 'workflow_dispatch' && '--all' || '' }}
