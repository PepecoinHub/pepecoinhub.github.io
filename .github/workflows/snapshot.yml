name: Daily snapshot

on:
  schedule:
    - cron: "17 3 * * *"          # every day at 03:17 UTC
  workflow_dispatch:               # the "Run workflow" button
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/snapshot.yml"

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  # Job 1: collect the data. Does not need GitHub Pages, so history starts
  # piling up even before Pages is switched on.
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write              # commit the new snapshot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # full history, so the sitemap can date each page by its last change
          filter: blob:none          # but only the file contents of the current commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Scheduled and manual runs always take a snapshot. A push takes one only
      # if there is none for today yet, so editing the site never overwrites it.
      - name: Take snapshot
        run: |
          today="$(date -u +%F)"
          if [ "${{ github.event_name }}" = "push" ] && [ -f "docs/data/snapshots/${today}.json" ]; then
            echo "Today's snapshot already exists, not taking another one on a push."
          else
            python scripts/snapshot.py || { echo "First attempt failed, retrying in 5 minutes"; sleep 300; python scripts/snapshot.py; }
          fi

      - name: Build summary
        run: |
          if ls docs/data/snapshots/*.json >/dev/null 2>&1; then
            python scripts/build_summary.py
          else
            echo "No snapshots yet, publishing the empty state."
          fi

      - name: Date the sitemap
        run: python scripts/build_sitemap.py || echo "sitemap dates not updated"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/rich-list.html docs/sitemap.xml
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "data: snapshot $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  # Job 2: publish the site. Fails with "HttpError: Not Found" in configure-pages
  # until Settings -> Pages -> Source is set to "GitHub Actions".
  deploy:
    needs: snapshot
    if: ${{ !cancelled() }}        # still publish (old data or the empty state) if the snapshot failed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # tip of the branch, includes the snapshot commit from job 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
