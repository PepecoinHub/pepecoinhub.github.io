name: Site checks
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check_site.py
      - run: python scripts/check_i18n.py
      - run: npm ci --prefix games/supabase/functions/haze-wallet --ignore-scripts --no-audit --no-fund
      - run: node --test tests/*.test.mjs
      - run: docker run --rm -d --name haze-ph-qa-ci --tmpfs /var/lib/postgresql/data:rw -e POSTGRES_PASSWORD=disposable-haze-ci postgres:17-alpine
      - run: |
          for i in {1..30}; do docker exec haze-ph-qa-ci pg_isready -U postgres && break; sleep 1; done
          HAZE_SQL_DOCKER=haze-ph-qa-ci node --test tests/haze-sql.test.mjs tests/haze-groups-sql.test.mjs
      - if: always()
        run: docker rm -f haze-ph-qa-ci || true
      - run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Check community drop panel at mobile and desktop widths
        run: |
          npm install --prefix /tmp/haze-layout playwright@1.57.0 --ignore-scripts --no-audit --no-fund
          /tmp/haze-layout/node_modules/.bin/playwright install --with-deps chromium
          PLAYWRIGHT_MODULE=/tmp/haze-layout/node_modules/playwright node tests/haze-drop-layout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haze-drop-layout
          path: /tmp/haze-layout-*.png
          if-no-files-found: ignore
      - name: Exercise PepeGochi integrated beta in Chromium
        if: always()
        env:
          PLAYWRIGHT_MODULE: /tmp/haze-layout/node_modules/playwright
          PEPEGOCHI_QA_SCREENSHOTS: /tmp/pepegochi-qa
        run: |
          mkdir -p "$PEPEGOCHI_QA_SCREENSHOTS"
          export HAZE_CHROMIUM="$(node -p 'require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath()')"
          status=0
          for test_file in tests/pepegochi-room-browser.cjs tests/pepegochi-room-interactions-browser.cjs tests/pepegochi-desktop-browser.cjs tests/pepegochi-companion-browser.cjs; do
            echo "Running $test_file"
            node "$test_file" || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pepegochi-beta-screenshots
          path: /tmp/pepegochi-qa/*.png
          if-no-files-found: ignore
  pepegochi-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: disposable-pepegochi-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test PepeGochi and Pond Quiz against disposable PostgreSQL
        env:
          PASSPORT_PG_URL: postgres://postgres:disposable-pepegochi-ci@127.0.0.1:5432/postgres
          PASSPORT_PG_MODULE: /tmp/pepegochi-pg/node_modules/pg/lib/index.js
        run: |
          npm install --prefix /tmp/pepegochi-pg pg@8.16.3 --ignore-scripts --no-audit --no-fund
          node --test --test-concurrency=2 tests/pepegochi*-sql.test.mjs tests/pepegochi-parity.test.mjs tests/pond-quiz-sql.test.mjs
