name: Pepe Guesser payouts

# Every Monday: posts the open Pepe Guesser rewards to a private Discord channel, one ready line per address
# ("send 12.5 PEP to P..."), for pasting into the tip bot (scripts/wp_payouts.py). Moves no coins.
# Needs the secrets WP_ROBOT_TOKEN (same as the puzzle robot) and WP_PAYOUT_WEBHOOK (Discord webhook URL).
# Optional repository variable WP_PAYOUT_TEMPLATE changes the line, e.g. "send {amount} PEP to {address}".
on:
  schedule:
    - cron: "7 7 * * 1"            # Mondays 07:07 UTC (GitHub may start it a few hours late)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wp-payouts
  cancel-in-progress: false

jobs:
  payouts:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send the payout list
        env:
          WP_ROBOT_TOKEN: ${{ secrets.WP_ROBOT_TOKEN }}
          WP_PAYOUT_WEBHOOK: ${{ secrets.WP_PAYOUT_WEBHOOK }}
          WP_PAYOUT_TEMPLATE: ${{ vars.WP_PAYOUT_TEMPLATE }}
        run: python -u scripts/wp_payouts.py
