name: Build approved V3 Passport atlas (one-time)
on:
  push:
    branches:
      - fix/passport-no-lily-v3-20261111
    paths:
      - .github/workflows/build-approved-v3-once.yml
      - scripts/build_v3_stamps.py
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the fix branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout owner-approved art sources from PR 233
        uses: actions/checkout@v4
        with:
          ref: art/fren-passport-v3-handoff-20261108
          path: .stamp-source
          persist-credentials: false
      - name: Checkout approved Pond Pioneer from PR 253
        uses: actions/checkout@v4
        with:
          ref: fix/share-fren-secret-pioneer-prelaunch
          path: .pioneer-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pillow
      - name: Build single optimized WebP atlas
        run: |
          cp .pioneer-source/games/fren-passport/source/stamps-new/pond_pioneer.png .stamp-source/games/fren-passport/source/stamps-new/pond_pioneer.png
          python scripts/build_v3_stamps.py .stamp-source/games/fren-passport
          python - <<'PY'
          from PIL import Image
          p = "docs/meme/passport-assets/stamps-v3.webp"
          im = Image.open(p)
          assert im.size == (49*138,150), im.size
          assert im.mode == "RGBA" or "A" in im.mode
          print(f"Checked {p}: {im.size}, {im.mode}")
          PY
      - name: Commit generated asset to this test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/meme/passport-assets/stamps-v3.webp
          git diff --cached --quiet && exit 0
          git commit -m "Build 49 approved V3 stamps from PR 233 and Pond Pioneer [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
