<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pepecoin Holder Watch | PEP rich list and concentration tracker</title>
<meta name="description" content="Daily snapshots of the top 1000 Pepecoin (PEP) wallets: how much of the supply the top 10, 25, 50, 100, 400 and 1000 addresses hold, and how that changes over days, months and a year.">
<meta property="og:title" content="Pepecoin Holder Watch">
<meta property="og:description" content="How concentrated is the PEP supply? Daily top 1000 holder snapshots with history.">
<meta property="og:type" content="website">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="style.css">
<script>
  // apply a saved theme before first paint
  try {
    var th = localStorage.getItem("phw-theme");
    if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th);
  } catch (e) {}
</script>
</head>
<body>
<div class="wrap" id="app">
  <noscript>
    <h1>Pepecoin Holder Watch</h1>
    <p>Daily snapshots of the top 1000 Pepecoin (PEP) wallets and how the share of supply held by the top 10, 25, 50, 100, 400 and 1000 addresses changes over time. This page needs JavaScript to draw its charts. The raw numbers are in <a href="data/shares.csv">shares.csv</a>.</p>
  </noscript>
  <p class="muted" id="boot">Loading the latest snapshot…</p>
</div>
<script src="app.js"></script>
</body>
</html>
